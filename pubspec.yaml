name: audiomancy_flutter
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter
  http: ^1.1.0
  flutter_dotenv: ^5.1.0
  audioplayers: ^6.1.0
  build_runner: ^2.4.6
  json_annotation: ^4.9.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.4
  json_serializable: ^6.7.1

flutter:
  uses-material-design: true

  assets:
    - .env # <-- AJOUTEZ CETTE LIGNE
    - assets/categories/
    - assets/images/avatar/
    - assets/images/icon/
    - assets/images/
    - assets/json/
    - assets/

flutter_icons:
  android: true
  ios: true
  image_path: "assets/images/favicon.png"
  adaptive_icon_background: '#FFFFFF'
  adaptive_icon_foreground: "assets/images/favicon.png"